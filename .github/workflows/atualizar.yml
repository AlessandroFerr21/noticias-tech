name: Atualizar notícias

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 no horário de Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install feedparser

      - name: Gerar o site
        run: python build_news.py

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Atualiza notícias"
          git push
